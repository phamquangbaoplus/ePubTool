name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Build Release app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project ePubTool.xcodeproj \
            -target ePubTool \
            -configuration Release \
            -sdk macosx \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER=com.phamquangbaoplus.ePubTool \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/release-build" \
            build

      - name: Install DMG packaging tool
        run: brew install create-dmg

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/release-build/ePubTool.app"
          test -f "$app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict --verbose=2 "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          mkdir -p dist
          archive="ePubTool-${TAG}-macOS-arm64.dmg"
          bash scripts/package-dmg.sh "$app" "dist/$archive"
          cat > dist/release-notes.md <<NOTES
          Download **[$archive](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$archive)** — Apple Silicon, macOS 27+.
          NOTES
          cat >> dist/release-notes.md <<'INSTALL'

          ### Install
          1. Open the DMG and drag **ePubTool** into **Applications**.
          2. Open Terminal and run:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/ePubTool.app" && open "/Applications/ePubTool.app"
          ```

          3. In **System Settings → Privacy & Security → Full Disk Access**, add **/Applications/ePubTool.app** and enable it.
          4. Quit ePubTool (⌘Q), reopen it from Applications, then click **Refresh**. Eject the DMG.

          Not notarized by Apple. Run the command only for a download you trust; it removes quarantine for this app only and does not grant Full Disk Access.
          INSTALL

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          # Keep incomplete uploads as drafts; reruns reuse the same version.
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/release.json")" = False ]; then
              echo "Release $TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "ePubTool $TAG" --draft \
              --notes-file dist/release-notes.md
          fi
          gh release upload "$TAG" "dist/ePubTool-${TAG}-macOS-arm64.dmg" --clobber
          gh release edit "$TAG" --draft=false --latest
